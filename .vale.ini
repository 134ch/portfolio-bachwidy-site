# Vale configuration. See docs/about-this-build/style-guide.md for the rules in plain words.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Portfolio
Packages = Microsoft

[*.md]
BasedOnStyles = Vale, Microsoft, House

# House choices that differ from the Microsoft style. See the style guide.
# Dates are written day month year, for example 27 Nov 2026.
Microsoft.DateFormat = NO
# Contractions and quote punctuation are not decided yet; show, don't fail.
Microsoft.Contractions = suggestion
Microsoft.Quotes = suggestion
